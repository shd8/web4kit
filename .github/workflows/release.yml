name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    # Opt-in: set the repository variable RELEASE_ENABLED=true (and the NPM_TOKEN secret) to publish.
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci.mjs
      # Opens a "Version Packages" PR from pending changesets; when that PR is merged,
      # publishes every @web4kit/* version not yet on npm.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance requires a public repository; enabled automatically once the repo is public.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
      # Every public package shares one version (fixed group), so the first entry names it.
      # Installs that version from npm, type-checks and runs it, and builds both starters made
      # with `pnpm create web4kit@<version>` (spec: public-release).
      - name: Smoke test the published packages
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/smoke.mjs --from-npm "$VERSION"
        env:
          VERSION: ${{ fromJSON(steps.changesets.outputs.publishedPackages)[0].version }}
