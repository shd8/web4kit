name: Pages

# Deploys the site to https://shd8.github.io/web4kit/ after CI passes on main (spec: site).
# Pages on a private repository needs a paid plan, so this runs only once the repository is
# public. One-time setting: Settings → Pages → Source: GitHub Actions.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.repository.private == false &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_BASE_PATH: /web4kit
      # The playground is built from committed recordings: no engine key, here or at runtime.
      JEV_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the packages the site uses, replays the playground recordings, then exports.
      - run: pnpm --filter "@web4kit/site..." build
      - run: node apps/site/scripts/check-links.mjs
      - run: pnpm --filter @web4kit/site e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/out
      # Last: a failure in any step above leaves the live site as it was.
      - id: deployment
        uses: actions/deploy-pages@v4
